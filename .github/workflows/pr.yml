name: Pull Request SideStore build
on:
  pull_request:
    # types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  build:
    name: Build and upload SideStore
    if: ${{ github.event.pull_request.draft == false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 'macos-14'
            version: '16.1'

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Rust libs without LSE (A10-safe)
        run: |
          set -e
          rustup target add aarch64-apple-ios
          export RUSTFLAGS="-C target-feature=-lse"
          echo "=== building minimuxer (no LSE) ==="
          cd SideStore/minimuxer
          cargo update -p tempfile --precise 3.10.1
          cargo update -p libc --precise 0.2.189
          cargo build --release --target aarch64-apple-ios
          cp target/aarch64-apple-ios/release/libminimuxer.a libminimuxer-ios.a
          ls -la libminimuxer-ios.a
          echo "=== building em_proxy (no LSE) ==="
          cd ../em_proxy
          cargo update -p libc --precise 0.2.189
          cargo build --release --target aarch64-apple-ios
          cp target/aarch64-apple-ios/release/libem_proxy.a libem_proxy-ios.a
          ls -la libem_proxy-ios.a
          echo "=== fetch pin-matched headers/glue (no machine code, LSE-free by nature) ==="
          # minimuxer generated.zip: cbindgen-generated header + swift glue, matching submodule pin baa22ac
          cd ../minimuxer
          MURL=$(curl -s "https://api.github.com/repos/SideStore/minimuxer/releases?per_page=100" | jq -r '[.[] | select(.body | test("baa22acbff1dc00d76e4186e55ae1904eec428cc"))][0].assets[] | select(.name=="generated.zip") | .browser_download_url' | head -1)
          if [ -z "$MURL" ]; then echo "pin-matched minimuxer release not found, falling back to latest"; MURL=$(curl -s "https://api.github.com/repos/SideStore/minimuxer/releases/latest" | jq -r '.assets[] | select(.name=="generated.zip") | .browser_download_url'); fi
          echo "downloading $MURL"
          wget -O generated.zip "$MURL"
          unzip -o generated.zip
          cp -v generated/* .
          find generated -type f ! -name 'minimuxer-Bridging-Header.h' ! -name 'minimuxer-helpers.swift' -exec rm -v {} \;
          rm generated.zip
          rmdir generated/
          # em_proxy.h: cbindgen-generated C header, matching submodule pin 24fdd24
          cd ../em_proxy
          EURL=$(curl -s "https://api.github.com/repos/SideStore/em_proxy/releases?per_page=100" | jq -r '[.[] | select(.body | test("24fdd245e62d8b2b2df1ac162770fbf95c5cd5bb"))][0].assets[] | select(.name=="em_proxy.h") | .browser_download_url' | head -1)
          if [ -z "$EURL" ]; then echo "pin-matched em_proxy release not found, falling back to latest"; EURL=$(curl -s "https://api.github.com/repos/SideStore/em_proxy/releases/latest" | jq -r '.assets[] | select(.name=="em_proxy.h") | .browser_download_url'); fi
          echo "downloading $EURL"
          wget -O em_proxy.h "$EURL"
          head -5 em_proxy.h
          echo "=== block fetch-prebuilt.sh from overwriting our no-LSE .a ==="
          cd ..
          touch .skip-prebuilt-fetch-minimuxer .skip-prebuilt-fetch-em_proxy
          ls -la .skip-prebuilt-fetch-minimuxer .skip-prebuilt-fetch-em_proxy

      - name: Install dependencies
        run: brew install ldid

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Add PR suffix to version
        run: sed -e "/MARKETING_VERSION = .*/s/\$/-pr.${{ github.event.pull_request.number }}+$(git rev-parse --short ${COMMIT:-HEAD})/" -i '' Build.xcconfig
        env:
          COMMIT: ${{ github.event.pull_request.head.sha }}

      - name: Get version
        id: version
        run: echo "version=$(grep MARKETING_VERSION Build.xcconfig | sed -e "s/MARKETING_VERSION = //g")" >> $GITHUB_OUTPUT

      - name: Echo version
        run: echo "${{ steps.version.outputs.version }}"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: ${{ matrix.version }}

      - name: Cache Build
        uses: irgaly/xcode-cache@v1
        with:
          key: xcode-cache-deriveddata-${{ github.sha }}
          restore-keys: xcode-cache-deriveddata-
          swiftpm-cache-key: xcode-cache-sourcedata-${{ github.sha }}
          swiftpm-cache-restore-keys: |
            xcode-cache-sourcedata-


      - name: Restore Pods from Cache (Exact match)
        id: pods-restore
        uses: actions/cache/restore@v3
        with:
          path: |
            ./Podfile.lock
            ./Pods/
            ./AltStore.xcworkspace/
          key: pods-cache-${{ hashFiles('Podfile') }}
          # restore-keys: |         # commented out to strictly check cache for this particular podfile
          #   pods-cache-
          
      - name: Restore Pods from Cache (Last Available)
        if: ${{ steps.pods-restore.outputs.cache-hit != 'true' }} 
        id: pods-restore-recent
        uses: actions/cache/restore@v3
        with:
          path: |
            ./Podfile.lock
            ./Pods/
            ./AltStore.xcworkspace/
          key: pods-cache-

      - name: Install CocoaPods
        # if: ${{ steps.pods-restore.outputs.cache-hit != 'true'}}
        id: pods-install
        run: |
          pod install

      - name: Save Pods to Cache
        id: save-pods
        if: ${{ steps.pods-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v3
        with:
          path: |
            ./Podfile.lock
            ./Pods/
            ./AltStore.xcworkspace/
          key: pods-cache-${{ hashFiles('Podfile') }}
    
      - name: List Files and derived data
        run: |
          echo ">>>>>>>>> Workdir <<<<<<<<<<"
          ls -la .
          echo ""
          
          echo ">>>>>>>>> Pods <<<<<<<<<<"
          find Pods -maxdepth 2 -exec ls -ld {} + || true  # List contents if directory exists    
          echo ""
          
          echo ">>>>>>>>> SideStore <<<<<<<<<<"
          find SideStore -maxdepth 2 -exec ls -ld {} +  || true  # List contents if directory exists    
          echo ""
          
          echo ">>>>>>>>> Dependencies <<<<<<<<<<"
          find Dependencies -maxdepth 2 -exec ls -ld {} +  || true  # List contents if directory exists    
          echo ""
          
          echo ">>>>>>>>> Xcode-Derived-Data <<<<<<<<<<"
          ls -la ~/Library/Developer/Xcode/DerivedData || true  # List contents if directory exists    
          echo ""

        
      - name: Build SideStore
        run: NSUnbufferedIO=YES make build 2>&1 | xcbeautify --renderer github-actions && exit ${PIPESTATUS[0]}

      - name: Fakesign app
        run: make fakesign

      - name: Convert to IPA
        run: make ipa

      - name: Add version to IPA file name
        run: mv SideStore.ipa SideStore-${{ steps.version.outputs.version }}.ipa

      - name: Upload SideStore.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-${{ steps.version.outputs.version }}.ipa
          path: SideStore-${{ steps.version.outputs.version }}.ipa

      - name: Upload *.dSYM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-${{ steps.version.outputs.version }}-dSYM
          path: ./SideStore.xcarchive/dSYMs/*
